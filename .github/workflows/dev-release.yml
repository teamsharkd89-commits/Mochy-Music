name: Dev Release

# Publishes a BeDivine release APK from the Mochy base, signed with the persistent
# debug keystore (same signature as every other BeDivine build, so it installs
# over the previous one). Run manually from the Actions tab.
on:
  workflow_dispatch:

jobs:
  dev_release:
    name: Build and publish BeDivine release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set Up Gradle
        uses: gradle/actions/setup-gradle@v4
        # cache on (default): dependencies and previous build outputs are reused,
        # so follow-up builds only recompile what changed instead of everything

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Decode persistent debug keystore
        run: echo "${{ secrets.DEBUG_KEYSTORE_BASE64 }}" | base64 -d > app/persistent-debug.keystore

      - name: Build foss release APKs
        run: ./gradlew assembleArm64FossRelease assembleUniversalFossRelease -PbedivineBuild=${{ github.run_number }} --no-configuration-cache --console=plain --warning-mode summary

      - name: Prepare release files
        run: |
          mkdir -p release
          cp app/build/outputs/apk/arm64Foss/release/app-arm64-foss-release.apk release/BeDivine-arm64-foss-release.apk
          cp app/build/outputs/apk/universalFoss/release/app-universal-foss-release.apk release/BeDivine-universal-foss-release.apk
          cd release
          sha256sum *.apk > SHA256SUMS.txt
          # the notes for this build come from release/CHANGELOG.md (first ## section):
          # body.md is what the in-app update sheet shows, changelog.json what the
          # full update screen shows. The section title is rewritten with the real
          # build number, so the file in the repo never needs to guess it.
          python3 - <<'PYEOF'
          import json, re
          run_number = "${{ github.run_number }}"
          version = f"9.0.0 build#{run_number}"
          text = open("CHANGELOG.md", encoding="utf-8").read()
          lines = text.splitlines()
          start = next(i for i, l in enumerate(lines) if l.startswith("## "))
          end = next((i for i in range(start + 1, len(lines)) if lines[i].startswith("## ")), len(lines))
          section = lines[start:end]
          body_lines, sections, current = [], [], None
          for line in section[1:]:
              m = re.match(r"^###\s+(.*)$", line)
              if m:
                  current = {"title": m.group(1).strip(), "items": []}
                  sections.append(current)
                  body_lines.append(line)
              elif line.strip().startswith("- "):
                  item = line.strip()[2:].strip()
                  if current is None:
                      current = {"title": "Novedades", "items": []}
                      sections.append(current)
                  current["items"].append(item)
                  body_lines.append(line)
              elif line.strip():
                  body_lines.append(line)
          open("body.md", "w", encoding="utf-8").write("\n".join(body_lines).strip() + "\n")
          data = {"description": f"BeDivine {version}", "changelog": sections}
          open("changelog.json", "w", encoding="utf-8").write(json.dumps(data, ensure_ascii=False, indent=2) + "\n")
          print(f"release notes for {version}: {len(sections)} sections")
          PYEOF
          ls -la

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: bedivine-9.0.0-${{ github.run_number }}
          name: BeDivine 9.0.0 build#${{ github.run_number }}
          body_path: release/body.md
          prerelease: false
          files: |
            release/BeDivine-arm64-foss-release.apk
            release/BeDivine-universal-foss-release.apk
            release/SHA256SUMS.txt
            release/changelog.json
